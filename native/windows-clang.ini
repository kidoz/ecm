# Meson native file: release build with clang targeting the MSVC ABI on Windows.
#
#   meson setup build --native-file native/windows-clang.ini
#
# The C runtime is linked statically so the executables need no VC++ redistributable.

[binaries]
c = 'clang'

[built-in options]
buildtype = 'release'
b_vscrt = 'mt'
