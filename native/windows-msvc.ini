# Meson native file: release build with the Visual Studio C compiler (cl).
#
# Run from a "Developer Command Prompt for VS" or after calling vcvars64.bat:
#   meson setup build --native-file native/windows-msvc.ini
#
# cl accepts C23 only through /std:clatest and, as of MSVC 19.51, still has no
# `nullptr` keyword in C mode, so it is mapped to NULL on the command line.
# The C runtime is linked statically so the executables need no VC++ redistributable.

[binaries]
c = 'cl'

[built-in options]
buildtype = 'release'
b_vscrt = 'mt'
c_std = 'none'
c_args = ['/std:clatest', '/Dnullptr=NULL']
